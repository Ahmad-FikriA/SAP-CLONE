version: '3.9'

services:
  mantis-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mantis-server
    restart: unless-stopped
    ports:
      - "3222:3000"
      - "2233:22"
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-kti-mock-secret-dev}
      URI: mssql://sa:admin123@host.docker.internal:1433/mantis_kti
      DB_INSTANCE: ${DB_INSTANCE:-SQLEXPRESS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount the entire application code so it can be edited live via SSH
      - .:/app
      # Ensure node_modules inside container is preserved and not overwritten by host's empty node_modules
      - /app/node_modules
      # Persist uploaded photos across container restarts
      - ./uploads:/app/uploads
    networks:
      - kti-net
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3000/api/spk", "--header", "Authorization: Bearer invalid" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  db:
    image: mysql:8.0
    container_name: kti-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-admin}
      MYSQL_DATABASE: kti_sap
    ports:
      - "3308:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    networks:
      - kti-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
  # mssql:
  #   image: mcr.microsoft.com/mssql/server:2025-latest
  #   container_name: kti-mssql
  #   user: root
  #   restart: unless-stopped
  #   environment:
  #     ACCEPT_EULA: "Y"
  #     MSSQL_SA_PASSWORD: "PasswordKTI123!"
  #   ports:
  #     - "1433:1433"
  #   volumes:
  #     - mssql-data:/var/opt/mssql/data
  #   networks:
  #     - kti-net

  web:
    image: node:24-alpine
    container_name: kti-web
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run build && npm start"
    ports:
      - "3224:3001"
    environment:
      # Must be the PUBLIC address of the backend (what the browser can reach)
      # Change to your server's IP or domain, e.g. http://192.168.1.x:3222
      NEXT_PUBLIC_API_URL: https://pphsekti.devlabfortirta.cloud
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - mantis-server
    networks:
      - kti-net

networks:
  kti-net:
    driver: bridge

